      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          // Beat 1-2: NACIÓ EN LOS '80 → HOY ES SÍMBOLO DE BELGRANO
          tl.fromTo("#h-l1", { x: -500, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "expo.out" }, 0.15);
          tl.fromTo("#h-80", { scale: 1.8, filter: "blur(18px)", opacity: 0 }, { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.45, ease: "power4.out", transformOrigin: "left center" }, 0.5);

          tl.fromTo("#h-hoy2", { x: 500, opacity: 0 }, { x: 0, opacity: 1, duration: 0.35, ease: "expo.out" }, 2.0);
          tl.fromTo("#h-80", { x: 0 }, { x: 20, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 2.0);

          // Cambio en el beat de 3 s: ANTES ZONA DE PASO → AHORA NO PARA

          tl.fromTo("#h-paso", { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 3.05);
          tl.fromTo("#h-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.inOut" }, 3.6);
          tl.fromTo("#h-paso", { opacity: 1 }, { opacity: 0.45, duration: 0.3, ease: "power1.out", immediateRender: false }, 3.75);
          tl.fromTo("#h-ahora", { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.25, ease: "power2.out" }, 4.45);
          tl.fromTo("#h-panel", { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "power3.out" }, 4.5);
          tl.fromTo("#h-nopara", { x: -900, skewX: 20, opacity: 0 }, { x: 0, skewX: 0, opacity: 1, duration: 0.4, ease: "expo.out" }, 4.55);
          ["#h-sp1", "#h-sp2", "#h-sp3"].forEach((s, i) => {
            tl.fromTo(s, { x: 300, opacity: 0 }, { x: 0, opacity: 1, duration: 0.25, ease: "power2.out" }, 4.75 + i * 0.05);
            tl.fromTo(s, { x: 0 }, { x: -60, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 5.05 + i * 0.05);

        })();
